<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جیسے تُو ہے پاس میرے</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500&family=Gulzar&family=Scheherazade+New:wght@400;500&display=swap">
<style>
:root{
  --bg:#0a0908; --ink:#f1e3c0; --gold:#c9a45c; --dim:rgba(201,164,92,.55);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 45%, #17130d 0%, #0a0908 55%, #050404 100%);
  color:var(--ink); overflow:hidden; touch-action:none;
  -webkit-user-select:none; user-select:none; cursor:pointer;
  font-family:'Noto Nastaliq Urdu','Gulzar','Gulzar Nastaliq','Scheherazade New',serif;
}
#stage{height:100%; display:flex; align-items:center; justify-content:center; padding:0 6vw; position:relative}
#line{
  --p:0; margin:0; text-align:center; direction:rtl; unicode-bidi:plaintext;
  font-size:clamp(1.8rem,5.8vw,3.7rem); line-height:2.5; padding:.75em .5em;
  color:var(--ink); max-width:100%; font-weight:500; word-spacing:.12em; font-style:oblique 12deg; font-synthesis:style;
  text-shadow:0 0 1px rgba(255,244,214,.7), 0 0 18px rgba(214,172,92,.38), 0 0 60px rgba(214,172,92,.16);
  -webkit-mask-image:linear-gradient(to left,#000 calc(var(--p)*1% - 18%),transparent calc(var(--p)*1%));
          mask-image:linear-gradient(to left,#000 calc(var(--p)*1% - 18%),transparent calc(var(--p)*1%));
  transition:opacity .9s ease, filter .9s ease, transform .9s ease;
}
#line.out{opacity:0; filter:blur(5px); transform:translateY(-6px)}
#line.hint{--p:130; opacity:.45}
#menu{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; gap:14px; align-items:center; transition:opacity .6s}
body.started #menu{opacity:0; pointer-events:none}
button{
  background:none; border:1px solid rgba(201,164,92,.4); color:var(--gold); border-radius:999px;
  min-width:44px; height:44px; padding:0 28px; font:inherit; font-size:1.1rem; cursor:pointer;
}
button:hover{background:rgba(201,164,92,.12)}
button:focus-visible{outline:2px solid var(--gold); outline-offset:3px}
#sync{font-size:.85rem; height:36px; opacity:.6}
#out{position:fixed; inset:auto 16px calc(env(safe-area-inset-bottom,0px) + 16px) 16px; display:none; flex-direction:column; gap:8px; z-index:5; cursor:auto; -webkit-user-select:text; user-select:text}
#out textarea{height:34vh; background:#0f0d0a; color:var(--ink); border:1px solid var(--dim); border-radius:8px; padding:10px; font:12px/1.4 monospace; direction:ltr}
body::after{content:""; position:fixed; inset:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px); border:1px solid rgba(201,164,92,.24); outline:1px solid rgba(201,164,92,.09); outline-offset:6px; border-radius:2px; pointer-events:none}
</style>
</head>
<body>
<div id="stage"><p id="line" aria-live="polite"></p></div>
<div id="menu">
  <button id="start" type="button">شروع کریں</button>
</div>
<audio id="song" src="tere pass main.mp3" preload="auto"></audio>
<script>
const OFFSET = 16;   // shift ALL lines: +1 = everything 1 second later, -1 = 1 second earlier

/* ========= EDIT TIMING HERE =========
   Each row:  [ start time, "lyric" ]
   Start time = when that line should begin in the song.
   Use seconds (12.5) or minutes:seconds ("1:05"). Keep rows in order. */
const LYRICS = [
  [   0, "جیسے تُو ہے پاس میرے" ],
  [   5, "تیرے پاس میں" ],
  [  10, "جیسے شاموں کے سویرے" ],
  [  15, "تیرے پاس میں" ],
  [  20, "جیسے کاغذ پہ کوئی نظم لکھی ہے" ],
  [  30, "جیسے نیچی نظر میں شرم چھپی ہے" ],
  [  36, "سانسوں میں رہتی نظم" ],
  [  42, "جیسے تُو ہے پاس میرے" ],
  [  48, "تیرے پاس میں" ],
  [  54, "جیسے شاموں کے سویرے" ],
  [  60, "تیرے پاس میں" ],
  [  66, "سانسوں میں لکھی / رہتی نظم" ],
  [  72, "جیسے پانی پاس پیاسے" ],
  [  78, "تیرے پاس میں" ],
  [  84, "جیسے دل کے ہیں دلاسے" ],
  [  90, "تیرے پاس میں" ],
  [  96, "جھوٹ ہیں یہ دوریاں" ],
  [ 102, "جھوٹ فاصلہ ہے" ],
  [ 108, "تجھے روز مل رہا ہوں میں" ],
  [ 114, "بات ہو خیال میں" ],
  [ 120, "جیسے ہونٹوں میں ہو لالی" ],
  [ 126, "تیرے پاس میں" ],
  [ 132, "جیسے کانوں میں ہو بالی" ],
  [ 138, "تیرے پاس میں" ],
  [ 144, "جیسے تُو ہے پاس میرے" ],
  [ 150, "تیرے پاس میں" ],
  [ 156, "جیسے شاموں کے سویرے" ],
  [ 162, "تیرے پاس میں" ],
  [ 168, "اپنی کہانی اُتنی رہے گی" ],
  [ 174, "چاہے بڑھا لو چاہے گھٹا لو" ],
  [ 180, "کاجل نہیں میں گالوں کا تل ہوں" ],
  [ 186, "مٹتا نہیں میں کتنا مٹا لو" ],
  [ 192, "میرا تو ہٹنا مشکل بڑا ہے" ],
  [ 198, "تم سامنے سے شیشہ ہٹا لو" ],
  [ 204, "جیسے آنکھوں کے اشارے" ],
  [ 210, "تیرے پاس میں" ],
  [ 216, "جیسے ندیا کے کنارے" ],
  [ 222, "تیرے پاس میں" ],
];
/* ===================================== */

const sec=v=>typeof v==='string'?v.split(':').reduce((a,b)=>a*60+parseFloat(b),0):v;
const START=LYRICS.map(r=>sec(r[0])+OFFSET), TEXT=LYRICS.map(r=>r[1]);

const el=document.getElementById('line'), song=document.getElementById('song');
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const REVEAL=3.6, FADE=.9, LAST_LEN=6;
let playing=false, cur=-2;

function frame(){
  const t=song.currentTime;
  let i=-1; for(let k=0;k<START.length;k++){ if(START[k]<=t) i=k; else break; }
  if(i!==cur){ cur=i; el.classList.remove('out'); el.textContent=i<0?'':TEXT[i]; }
  if(i>=0){
    const s=START[i], last=i===START.length-1, n=last?s+LAST_LEN:START[i+1];
    const dur=Math.max(.5,n-s), local=t-s, rev=Math.min(REVEAL,dur*.6);
    el.style.setProperty('--p',(ease(Math.min(1,local/rev))*130).toFixed(2));
    el.classList.toggle('out', local>dur-FADE);
  }
  requestAnimationFrame(frame);
}

document.getElementById('start').onclick=e=>{
  e.stopPropagation(); document.body.classList.add('started');
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{
    song.currentTime=0; const p=song.play(); if(p&&p.catch) p.catch(()=>{});
    playing=true; frame();
  });
};
document.body.addEventListener('click',()=>{ if(playing) song.paused?song.play():song.pause(); });
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
</script>
</body>
</html>
