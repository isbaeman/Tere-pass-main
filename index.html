<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جیسے تُو ہے پاس میرے</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500&family=Gulzar&family=Scheherazade+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0908; --ink:#f1e3c0; --gold:#c9a45c; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width:100%; height:100%; margin:0; }
body {
  background: radial-gradient(ellipse at 50% 45%, #17130d 0%, #0a0908 55%, #050404 100%);
  color: var(--ink); overflow:hidden; touch-action:manipulation; user-select:none; cursor:pointer;
  font-family:'Noto Nastaliq Urdu','Gulzar','Scheherazade New',serif;
}
/* two stacked layers: the old line fades while the new one is written */
#stage { width:100%; height:100%; display:grid; place-items:center; padding:0 6vw; }
.line {
  --reveal: -20%;
  grid-area:1/1; margin:0; width:100%; text-align:center; direction:rtl; unicode-bidi:plaintext;
  font-size:clamp(1.8rem,5.8vw,3.7rem); line-height:2.5; padding:.75em .5em;
  color:var(--ink); font-weight:500; word-spacing:.12em;
  opacity:0; transition:opacity .7s ease;
  text-shadow: 0 0 1px rgba(255,244,214,.7), 0 0 18px rgba(214,172,92,.38), 0 0 60px rgba(214,172,92,.16);
  -webkit-mask-image: linear-gradient(to left, #000 0%, #000 var(--reveal), transparent calc(var(--reveal) + 20%));
  mask-image: linear-gradient(to left, #000 0%, #000 var(--reveal), transparent calc(var(--reveal) + 20%));
}
.line.on  { opacity:1; transition:opacity .25s ease; }
.line.off { opacity:0; transition:opacity .9s ease; }

#menu { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); transition:opacity .8s ease; z-index:3; }
body.started #menu { opacity:0; pointer-events:none; }
button {
  background:rgba(10,9,8,.75); border:1px solid rgba(201,164,92,.6); color:var(--gold);
  border-radius:999px; min-height:48px; padding:8px 28px; font:inherit; font-size:1.1rem; cursor:pointer; transition:background .4s ease;
}
button:hover { background:rgba(201,164,92,.12); }
button:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
#status {
  position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 24px); left:0; right:0;
  text-align:center; color:var(--gold); opacity:.65; font-size:.8rem; pointer-events:none;
}
body::after {
  content:""; position:fixed;
  inset:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  border:1px solid rgba(201,164,92,.24); outline:1px solid rgba(201,164,92,.09); outline-offset:6px; border-radius:2px; pointer-events:none;
}
@media (max-width:600px) { .line { font-size:clamp(1.6rem,7vw,2.5rem); line-height:2.3; } }
@media (prefers-reduced-motion: reduce) { .line, .line.on, .line.off { transition:none; } }
</style>
</head>
<body>

<div id="stage">
  <p class="line" id="lineA" aria-live="polite"></p>
  <p class="line" id="lineB" aria-hidden="true"></p>
</div>
<div id="menu"><button id="start" type="button">شروع کریں</button></div>
<div id="status">شروع کرنے کے لیے بٹن دبائیں</div>

<audio id="song" preload="auto">
  <source src="tere pass main.mp3" type="audio/mpeg">
  <source src="tere_pass_main.mpeg" type="audio/mpeg">
</audio>

<script>
// Start times were measured from the audio itself (vocal onsets), in seconds.
// OFFSET shifts everything: use a small + value if lyrics feel early, - if late.
const OFFSET = 0;
// Text starts being written this much before the voice, so the eye leads the ear.
const LEAD = 0.15;
const SONG_END = 237;   // last line finishes here

const LYRICS = [
  [16.5,  "جیسے تُو ہے پاس میرے"],
  [21.65, "تیرے پاس میں"],
  [26.7,  "جیسے شاموں کے سویرے"],
  [31.8,  "تیرے پاس میں"],

  [36.05, "جیسے کاغذ پہ کوئی نظم لکھے"],
  [41.95, "یا بھولی سی کوئی قسم"],

  [46.95, "جیسے پانی پاس پیاسے"],
  [52.05, "تیرے پاس میں"],
  [57.1,  "جیسے دل کے ہیں دلاسے"],
  [62.25, "تیرے پاس میں"],

  [77.3,  "جھوٹ ہے یہ دوریاں"],
  [82.5,  "جھوٹ فاصلہ ہے"],
  [86.65, "تیرے ساتھ ہی رہوں گا میں"],
  [92.7,  "بات میں، خیال میں"],

  [97.65, "جیسے ہونٹوں میں ہو لالی"],
  [102.8, "تیرے پاس میں"],
  [107.8, "جیسے کانوں میں ہو بالی"],
  [112.9, "تیرے پاس میں"],

  [117.9, "جیسے تُو ہے پاس میرے"],
  [123.05,"تیرے پاس میں"],
  [128.1, "جیسے شاموں کے سویرے"],
  [133.2, "تیرے پاس میں"],

  [154.5, "اپنی کہانی اُتنی رہے گی"],
  [158.5, "چاہے بڑھا لو"],
  [161.1, "چاہے گھٹا لو"],
  [163.6, "کاجل نہیں میں"],
  [166.1, "گالوں کا تل ہوں"],
  [168.7, "مٹتا نہیں میں، کتنا مٹا لو"],
  [174.7, "میرا تو ہٹنا مشکل بڑا ہے"],
  [179.3, "تم سامنے سے شیشہ ہٹا لو"],

  [186.4, "جیسے آنکھوں کے اشارے"],
  [191.5, "تیرے پاس میں"],
  [196.5, "جیسے ندیا کے کنارے"],
  [201.75,"تیرے پاس میں"],

  [205.9, "جیسے کاغذ پہ کوئی نظم لکھے"],
  [211.8, "یا بھولی سی کوئی قسم"],

  [216.9, "جیسے تُو ہے پاس میرے"],
  [221.9, "تیرے پاس میں"],
  [226.95,"جیسے شاموں کے سویرے"],
  [232.0, "تیرے پاس میں"]
];

const START = LYRICS.map(r => r[0] + OFFSET);
const TEXT  = LYRICS.map(r => r[1]);
// A line is written over roughly as long as it is sung: scaled by length,
// never longer than the time until the next line.
const WRITE = START.map((s, i) => {
  const gap = (i < START.length - 1 ? START[i + 1] : SONG_END + OFFSET) - s;
  const sung = 0.9 + 0.17 * TEXT[i].length;
  return Math.max(1.2, Math.min(sung, gap * 0.88, 6.5));
});

const layers = [document.getElementById("lineA"), document.getElementById("lineB")];
const song = document.getElementById("song");
const startBtn = document.getElementById("start");
const status = document.getElementById("status");

const FADE_OUT = 2.2;      // final line fade-out (seconds)
const EDGE = 20;           // soft edge width of the writing wipe (%)
let playing = false, running = false, cur = -2, front = 0;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
// gentle start, steady middle, soft landing
const ease = t => t * t * (3 - 2 * t) * 0.55 + t * 0.45;

// --- Smooth clock -----------------------------------------------------------
// audio.currentTime updates in coarse steps on many browsers, which makes the
// wipe stutter. Between updates we extrapolate with performance.now(), then
// snap back to the real audio time whenever it advances.
let lastCT = 0, lastPerf = 0, clock = 0;
function now() {
  const ct = song.currentTime, p = performance.now();
  if (ct !== lastCT) { lastCT = ct; lastPerf = p; }
  if (song.paused || song.ended) { clock = ct; return clock; }
  const ahead = Math.min((p - lastPerf) / 1000, 0.25) * song.playbackRate;
  const est = ct + ahead;
  clock = Math.abs(est - clock) > 0.3 ? est : Math.max(clock, est); // never jitter backwards
  return clock;
}

function show(i) {
  const old = layers[front];
  front ^= 1;
  const el = layers[front];
  old.classList.remove("on"); old.classList.add("off");
  el.classList.remove("off");
  el.style.setProperty("--reveal", (-EDGE) + "%");
  el.textContent = i < 0 ? "" : TEXT[i];
  el.setAttribute("aria-hidden", "false"); old.setAttribute("aria-hidden", "true");
  if (i >= 0) { void el.offsetWidth; el.classList.add("on"); }
}

function frame() {
  const t = now() + LEAD;

  let i = -1;
  for (let k = 0; k < START.length; k++) { if (START[k] <= t) i = k; else break; }
  if (i !== cur) { cur = i; show(i); }

  if (i >= 0) {
    const el = layers[front];
    const p = ease(clamp((t - START[i]) / WRITE[i]));
    el.style.setProperty("--reveal", (-EDGE + (100 + EDGE) * p).toFixed(2) + "%");

    if (i === START.length - 1) {
      const after = clamp((t - (SONG_END + OFFSET)) / FADE_OUT);
      el.style.opacity = (1 - after * after * (3 - 2 * after)).toFixed(3);
    } else if (el.style.opacity) el.style.opacity = "";
  }
  if (running) requestAnimationFrame(frame);
}

startBtn.addEventListener("click", async (e) => {
  e.stopPropagation();
  if (playing) return;
  document.body.classList.add("started");
  status.textContent = "نظم کے ساتھ۔۔۔";
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    song.currentTime = 0; cur = -2;
    await song.play();
    playing = true;
    if (!running) { running = true; requestAnimationFrame(frame); }
  } catch (err) {
    status.textContent = "آڈیو فائل چیک کریں: tere pass main.mp3";
    document.body.classList.remove("started");
  }
});

// Tap the background to pause or resume.
document.body.addEventListener("click", async (e) => {
  if (e.target.closest("button") || !playing) return;
  if (song.paused) {
    try { await song.play(); } catch (err) { status.textContent = "دوبارہ پلے کرنے کے لیے ٹیپ کریں"; }
  } else song.pause();
});

song.addEventListener("seeked", () => { clock = song.currentTime; cur = -2; });
song.addEventListener("ended", () => { playing = false; status.textContent = "اختتام"; });
song.addEventListener("error", () => { status.textContent = "آڈیو نہیں ملی — فائل کا نام چیک کریں"; });
</script>
</body>
</html>
